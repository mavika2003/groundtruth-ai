[project]
name = "groundtruth-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "pydantic-settings>=2,<3",
  "httpx>=0.27,<1", "pypdf>=5,<7", "rank-bm25>=0.2,<1", "python-multipart>=0.0.9,<1",
  "pyjwt[crypto]>=2.9,<3", "fastembed>=0.4,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp>=1.28,<2",
]
[project.optional-dependencies]
eval = ["ragas>=0.3.9,<0.4", "datasets>=3,<5", "langchain-openai>=0.3,<1"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["groundtruth*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
